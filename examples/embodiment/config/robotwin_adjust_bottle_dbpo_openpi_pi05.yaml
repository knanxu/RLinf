# DBPO (Drift-Based Policy Optimization) + PPO clip on RoboTwin Adjust Bottle.
#
# This config fine-tunes a drifting Pi0.5 checkpoint (1-NFE deterministic policy)
# with the DBPO stochastic adapter (Gao et al. 2026):
#   pi_{theta,psi}(x | o, z) = N(x; mu_theta(o, z), diag(sigma_psi(o)^2))
# where mu comes from the pretrained drift policy (_sample_actions_drifting) and
# sigma from a zero-initialised state-conditioned log-std head.
#
# Differences versus robotwin_adjust_bottle_ppo_openpi_pi05.yaml:
#   * actor.model.openpi.noise_method = "drift_dbpo"
#       -> RLinf loads OpenPi0DBPOForRLActionPrediction instead of the flow
#          variant. sample_actions() does 1-NFE drift, logprob is exact Gaussian
#          on the executed action prefix.
#   * actor.model.num_steps = 1
#       -> DBPO has a single effective denoise step.
#   * actor.model.openpi.dbpo_*: config knobs for the log-std head / sampling.
#   * algorithm.loss_type stays "actor_critic" (PPO clip) at first — we keep
#     the ratio clip tight to compensate for not running the anchor loss.
#   * clip_ratio_high/low default 0.05 (DBPO paper uses ~0.02 for RoboMimic).

defaults:
  - env/robotwin_adjust_bottle@env.train
  - env/robotwin_adjust_bottle@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-7

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_adjust_bottle_dbpo_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: 10
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 4
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 5
  adv_type: gae
  loss_type: actor_critic   # standard PPO clip; switch to bpo_actor_critic for BPO
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0

  # DBPO paper uses tight clip (~0.02 for RoboMimic, 0.05 for D4RL) since we do
  # not run the anchor loss in this first pass. Start tight, loosen if the
  # policy is not improving.
  clip_ratio_high: 0.05
  clip_ratio_low: 0.05
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: True
  train:
    total_num_envs: 256
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    group_size: ${algorithm.group_size}
    assets_path: "/path/to/robotwin_assets"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/train_seeds.json
    center_crop: False
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
  eval:
    total_num_envs: 128
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 200
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 200
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: "/path/to/robotwin_assets"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 2048
  seed: 1234
  enable_offload: True

  model:
    # Point this at your openpi drifting stage-1 checkpoint for adjust_bottle.
    # The directory must contain *.safetensors (openpi native) plus an
    # assets/<asset_id>/norm_stats.json matching the trained policy.
    model_path: "/path/to/openpi_drifting_ckpt/adjust_bottle"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: True
    num_steps: 1   # DBPO is 1-NFE
    openpi:
      config_name: "pi05_aloha_robotwin"
      num_images_in_input: 3
      # --- DBPO knobs (read by OpenPi0DBPOConfig) ---
      noise_method: "drift_dbpo"
      detach_critic_input: True
      dbpo_init_log_std: -3.5
      dbpo_min_logprob_std: 0.03
      dbpo_max_logprob_std: 0.30
      dbpo_min_sampling_std: 0.03
      dbpo_randn_clip: 3.0
      # Start with a state-independent log-std (bias-only) for stability.
      # Flip to False to let sigma condition on the prefix features.
      dbpo_freeze_logstd_cond: True
      # Anchor loss is not wired into the PPO loss path yet; kept as 0.
      dbpo_anchor_coef: 0.0

  optim:
    lr: 5.0e-06
    value_lr: 1.0e-04
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    # Train critic (value head is randomly init'd) for a few iters before
    # letting the actor update on PPO ratios.
    critic_warmup_steps: 200

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
